<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="Registration_style.css">
</head>
<body>
    <main>
        <section>
            <h1>Регистрация</h1>

            <div>
                <form action="./try.html">
                    <div class="form_div form_input">
                        <label for="f_name">Имя</label>
                        <input 
                            type="text" 
                            id="f_name" 
                            placeholder="..."
                            name="name"
                            required
                        >
                    </div>

                    <div class="form_div form_input">
                        <label for="s_name">Фамилия</label>
                        <input 
                            type="text" 
                            id="s_name" 
                            placeholder="..."
                            name="surname"
                            required
                        >
                    </div>

                    <div class="form_div form_input">
                        <label for="email">Почта</label>
                        <input 
                            type="email"
                            id="email"
                            placeholder="your@email.com"
                            name="email"
                            required
                        >
                    </div>

                    <div class="form_div form_input">
                        <label for="pass">Пароль</label>
                        <input 
                            type="password" 
                            id="pass" 
                            placeholder="12345"
                            name="password"
                            required
                        >
                    </div>

                    <div class="form_div">
                        <label for="adree"> Согласен с обработкой данных </label>
                        <input 
                            type="checkbox"
                            name="adree"
                            id="agree"
                            required
                        >
                    </div>

                    <div class="form_div">
                        <button>Зарегистрироваться</button>
                    </div>
                </form>
            </div>

            <div id="a">
                <a href="./">Уже есть аккаунт?</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="brdr">
            @заверено мной
        </div>
    </footer>
</body>
</html>
