<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="Registration_style.css">
</head>
<body>
    <main>
        <div class="a">a</div>
        <section class="filling">
            <h1>Регистрация</h1>
            <div>
                <form action="./try.html">
                    <div>
                        <label>
                            Введите email
                            <input 
                                type="email"
                                value="your@email.com"
                                name="email"
                                required
                            >
                        </label>
                    </div>
                    <div>
                        <label for="pass">Введите пароль</label>
                        <input 
                            type="password" 
                            id="pass" 
                            placeholder="password"
                            name="password"
                            required
                        >
                    </div>
                    <div>
                        <input 
                            type="radio" 
                            name="radio" 
                            id="save" 
                            value="save" 
                            required
                            class="radio"
                        >
                        <label for="save" class="radio">Сохранять данные</label>
                    </div>
                    <div>
                        <input 
                            type="radio" 
                            name="radio" 
                            id="not_save" 
                            value="not_save"
                        >
                        <label for="not_save" class="radio">Не сохранять данные</label>
                    </div>
                    <div>
                        <label for="adree">
                            Согласен с обработкой данных
                        </label>
                        <input 
                            type="checkbox"
                            name="adree"
                            id="agree"
                            required
                        >
                    </div>
                    <div>
                        <button>Зарегистрироваться</button>
                    </div>
                    <br>
                    <div class="start">
                        <label for="num">Оцените сервис</label>
                        <br>
                        <input
                            type="range"
                            name="num"
                            id="num"
                            min="0"
                            max="5"
                        >
                    </div>
                    <div>
                        <p>Комментарий</p>
                        <textarea 
                            name="text"
                            rows="5"
                            cols="50"
                            placeholder="Введите текст"
                            minlength="3"
                            maxlength="200"
                        ></textarea>
                    </div>
                </form>
            </div>
        </section>
        <section class="try_st"></section>
        <section>
            <!-- <img
                src="https://optim.tildacdn.com/tild3332-6664-4131-b836-383962356338/-/resize/744x/-/format/webp/Karelia_1.JPG.webp"
                alt=""
                class="bg"
            > -->
        </section>
    </main>
    <footer>
        <div class="brdr">
            @заверено мной
        </div>
    </footer>
</body>
</html>
